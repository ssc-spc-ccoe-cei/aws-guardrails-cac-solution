AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Build-only SAM template for the dashboard Lambda artifact

Globals:
  Function:
    Timeout: 60
    MemorySize: 512

Resources:
  GenerateDashboardLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: index.lambda_handler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
