Outputs:
  ConformancePackP1Name:
    Condition: HasAccountsInP1
    Description: Name of the partition-1 conformance pack (the always-on pack in normal operation).
    Value: !Ref ConformancePackP1
  ConformancePackP2Name:
    Condition: HasAccountsInP2
    Description: Name of the partition-2 conformance pack (when present).
    Value: !Ref ConformancePackP2
  ConformancePackP3Name:
    Condition: HasAccountsInP3
    Description: Name of the partition-3 conformance pack (when present).
    Value: !Ref ConformancePackP3
