AWSTemplateFormatVersion: 2010-09-09
Description: Configures AWS Config guardrail Lambdas for multi-account management.

Parameters:
  OrganizationName:
    Type: String
    Default: ""
    Description: The name of the organization. Used as a prefix in resource names.
  AuditAccountID:
    Type: String
    Default: ""
    Description: 12-digit AWS Account ID (e.g., '222222222222')
  RolePrefix:
    Type: String
    Default: "ASEA-"
    Description: >-
      The prefix to apply to generated role names, in ASEA this is generally ASEA- for lza this could be cdk-accel etc
  PythonRuntime:
    Type: String
    Default: "python3.12"
    Description: The python runtime to use for the compliance dashboard
  DefaultCloudProfile:
    Type: String
    Description: The cloud profile to use when one is not provided by an account.
  PartitionCount:
    Type: String
    Default: "1"
    AllowedValues:
      - "1"
      - "2"
      - "3"
    Description: >-
      Number of account partitions to deploy guardrail Lambda clones for.
      Set by main.yaml from the aws_account_partitioner Custom Resource
      output. 1 = single partition (legacy behaviour, no clones).
      2 = create _p2 clones. 3 = create _p2 and _p3 clones.

Conditions:
  IsAuditAccount: !Equals
    - !Ref AWS::AccountId
    - !Ref AuditAccountID
  CreatePartition2: !Not
    - !Equals
      - !Ref PartitionCount
      - "1"
  CreatePartition3: !Equals
    - !Ref PartitionCount
    - "3"
  IsAuditAccountAndCreatePartition2: !And
    - !Condition IsAuditAccount
    - !Condition CreatePartition2
  IsAuditAccountAndCreatePartition3: !And
    - !Condition IsAuditAccount
    - !Condition CreatePartition3

Resources:
  CloudGuardrailsCommonLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: CloudGuardrailsCommonLayerPart6
      CompatibleRuntimes:
        - python3.12
      Content: "../../src/layer/cloud_guardrails/build/CloudGuardrailsCommonLayer/"

  GC07CheckCertificateAuthoritiesLambda:
    Condition: IsAuditAccount
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${OrganizationName}gc07_check_certificate_authorities"
      Code: "../../src/lambda/gc07_check_certificate_authorities/build/GC07CheckCertificateAuthoritiesLambda/"
      Handler: app.lambda_handler
      Role: !Sub "arn:aws:iam::${AuditAccountID}:role/${RolePrefix}default_assessment_role"
      Runtime: !Ref PythonRuntime
      Timeout: 600
      Layers:
        - !Ref CloudGuardrailsCommonLayer
      LoggingConfig:
        LogGroup: !Sub "${OrganizationName}gc_guardrails"
        LogFormat: "JSON"
      Environment:
        Variables:
          DEFAULT_CLOUD_PROFILE: !Ref DefaultCloudProfile

  GC07CheckCertificateAuthoritiesLambdaP2:
    Condition: IsAuditAccountAndCreatePartition2
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${OrganizationName}gc07_check_certificate_authorities_p2"
      Code: "../../src/lambda/gc07_check_certificate_authorities/build/GC07CheckCertificateAuthoritiesLambda/"
      Handler: app.lambda_handler
