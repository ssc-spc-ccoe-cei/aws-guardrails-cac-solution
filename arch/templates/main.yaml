            Effect: Allow
          - Sid: AllowCloudFront
            Action:
              - "cloudfront:Describe*"
              - "cloudfront:Get*"
              - "cloudfront:List*"
            Resource: "*"
            Effect: Allow
      PolicyName: !Sub "${OrganizationName}GCLambdaExecutionRoleInTransitEncryptionPolicy"
      Roles:
