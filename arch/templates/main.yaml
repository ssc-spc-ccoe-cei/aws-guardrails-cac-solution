AWSTemplateFormatVersion: 2010-09-09
Description: Deploys the Government of Canada Guardrails Assessment Package

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Required Parameters
        Parameters:
          - AcceleratorRole
          - AccelRolePrefix
          - AuditAccountID
          - BGA1
          - BGA2
          - BGA3
          - BGA4
          - ExecutionName
          - ExecutionName2
          - OrganizationId
          - OrganizationName
          - PipelineBucket
          - RolePrefix
          - RootOUID
          - SecurityOUID
          - TenantId
          - DefaultCloudProfile
          - LogArchiveAccountName
          
      - Label:
          default: Optional Parameters
        Parameters:
          - AdditionalAssessmentAdminRoleARN
          - AWSConfigConformsBucketName
          - DeployRoles
          - DeployVersion
          - DestBucketName
          - EvidenceBucketName
          - MaxAccountsPerPartition
          - MaxPartitions
    ParameterLabels:
      OrganizationName:
        default: The name of the organization
      OrganizationId:
        default: The ID of the organization
      TenantId:
        default: The ID of the tenant
      DefaultCloudProfile:
        default: The cloud profile to use when one is not provided by an account
      ExecutionName:
        default: Execution name of the IAM role that is passed to GC permission's for report files
      ExecutionName2:
        default: Execution name of the IAM role that is passed to GC permission's for evidence files
      RootOUID:
        default: ID of the AWS Organizations Root OU
      AuditAccountID:
        default: AWS Account ID of the Audit Account
      BGA1:
        default: First Breakglass Account
      BGA2:
        default: Second Breakglass Account
      BGA3:
        default: Third Breakglass Account
      BGA4:
        default: Fourth Breakglass Account
      LogArchiveAccountName:
        default: Log Archive Account Name
      SecurityOUID:
        default: ID of the AWS Organizations Security OU
      RolePrefix:
        default: The prefix to apply to generated role names
      AccelRolePrefix:
        default: The Accelerator role prefix for privileged access, in ASEA or LZA deployed by ProServices this could be AWSA- etc
      AcceleratorRole:
        default: The role used to assume access to organizational accounts, in ASEA = ASEA-PipelineRole, LZA = OrganizationAccountAccessRole could also be PBMMAccel etc.
      PipelineBucket:
        default: The deployment pipeline bucket holding child templates and packaged lambda code.
      EvidenceBucketName:
        default: Name for the S3 Evidence bucket
      AWSConfigConformsBucketName:
        default: Name for the S3 AWS Config Conformance Pack assets bucket
      AdditionalAssessmentAdminRoleARN:
        default: Additional Audit Manager Assessment Admin Role ARN
      DestBucketName:
        default: Name of the S3 bucket (leave as is unless instructed otherwise)
      DeployRoles:
        default: True/ False flag used to create GC Guardrails Roles (default - False)
      DeployVersion:
        default: The version to deploy
      GC04EnterpriseMonitoringIAMRoleName:
        default: GC04 Enterprise Monitoring IAM Role Name
      GC04EnterpriseMonitoringIAMTrustedPrincipal:
        default: GC04 Enterprise Monitoring IAM Trusted Principal
      PythonRuntime:
        default: Python Runtime
      MaxAccountsPerPartition:
        default: Max accounts per partition (Account Partitioner)
      MaxPartitions:
        default: Max number of partitions (Account Partitioner)

Parameters:
  OrganizationName:
    Type: String
    Description: >-
      The name of the organization that will be used as a prefix to stack resources including lambdas.
  OrganizationId:
    Type: String
    Description: >-
      Organization Id provided by root.yaml.
  TenantId:
    Type: String
    Description: >-
      Tenant Id provided by root.yaml.
  DefaultCloudProfile:
    Type: String
    Description: >-
      The cloud profile to use when one is not provided by an account.
  ExecutionName:
    Type: String
    Description: >-
      Execution name of the IAM role that is passed to GC permission's for report files.
  ExecutionName2:
    Type: String
    Description: >-
      Execution name of the IAM role that is passed to GC permission's for evidence files.
  RootOUID:
    Type: String
    Default: ""
    Description: Copy from the AWS Organizations console (e.g., r-abc1)
  AuditAccountID:
    Type: String
    Default: ""
    Description: 12-digit AWS Account ID (e.g., '222222222222')
  BGA1:
    Type: String
    Default: "bgUser1"
    Description: First breakglass account name
  BGA2:
    Type: String
    Default: "bgUser2"
    Description: Second breakglass account name
  BGA3:
    Type: String
    Default: "bgUser3"
    Description: Third breakglass account name
  BGA4:
    Type: String
    Default: "bgUser4"
    Description: Fourth breakglass account name
  LogArchiveAccountName:
    Type: String
    Default: "LogArchive"
    Description: Name of Log Archive account
    
  SecurityOUID:
    Type: String
    Default: ""
    Description: >-
      Copy from the AWS Organizations console (e.g., ou-1234-abcdefg)
  RolePrefix:
    Type: String
    Default: "AM-"
    Description: >-
      The prefix to apply to generated role names
  AccelRolePrefix:
    Type: String
    Default: "AWSA-"
    Description: >-
      The Accelerator role prefix for privileged access, in ASEA or LZA deployed by ProServices this could be AWSA- etc
  AcceleratorRole:
    Type: String
    Description: >-
      The role used to assume access to organizational accounts, in ASEA = ASEA-PipelineRole, LZA = OrganizationAccountAccessRole could also be PBMMAccel etc.
  PipelineBucket:
    Type: String
    Description: >-
      The deployment pipeline bucket holding child templates and packaged lambda code.
  EvidenceBucketName:
    Type: String
    Default: ""
    Description: >-
      Bucket will store evidence documents. If not provided, a name will be generated.
  AWSConfigConformsBucketName:
    Type: String
    Default: ""
    Description: >-
      Bucket will store AWS Config Conformance Pack assets. If not provided, a name will be generated. (name must start with awsconfigconforms- ).
  AdditionalAssessmentAdminRoleARN:
    Type: String
    Default: ""
    Description: >-
      ARN of any additional role that should be configured as owners of the Assessment in Audit Manager
  DestBucketName:
    Type: String
    Default: "*GCDestBucketName*"
    Description: Bucket to which evidence will be shared
  GC04EnterpriseMonitoringIAMRoleName:
    Type: String
    Default: "CloudBrokering"
  GC04EnterpriseMonitoringIAMTrustedPrincipal:
    Type: String
    Default: "arn:aws:iam::939755092653:root"
  DeployRoles:
    Type: String
    Default: false
    AllowedValues: [true, false]
  InvokeUpdate:
    Type: String
  DeployVersion:
    Type: String
  PythonRuntime:
    Type: String
    Default: "python3.12"
    Description: The python runtime to use for the compliance dashboard
  MaxAccountsPerPartition:
    Type: Number
    Default: 70
    MinValue: 1
    MaxValue: 200
    Description: >-
      Maximum number of accounts assigned to each partition by the Account
      Partitioner Lambda. Keeps each guardrail Lambda's resource-based policy
      under the 20 KB IAM limit. Adjust only if the underlying policy size
      assumption changes.
  MaxPartitions:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 3
    Description: >-
      Maximum number of partitions the Account Partitioner Lambda is allowed
      to create. Hard-capped at 3 because the AuditAccountPreRequisitesPart*
      templates and ConformancePack only define conditional clones for
      partitions 1, 2, and 3. Total addressable accounts =
      MaxAccountsPerPartition x MaxPartitions (default 70 x 3 = 210).
  RootStackName:
    Type: String
    Description: >-
      Name of the root CloudFormation stack (passed in from root.yaml). The
      partition-sync Step Function calls cloudformation:UpdateStack against
      this stack to cascade fresh AccountsInP1/P2/P3 values into the
      ConformancePack nested stack and PartitionCount into the Part1-8
      StackSets when the partitioner reports accountsChanged=true. Nested
      stacks cannot be updated directly, so the state machine has to target
      the root.

Conditions:
  GenerateEvidenceBucketName: !Equals [!Ref EvidenceBucketName, ""]
  GenerateAWSConfigConformsBucketName:
    !Equals [!Ref AWSConfigConformsBucketName, ""]
  DeployRoles: !Equals [!Ref DeployRoles, "true"]

Resources:
  ##################################################
  # Part 1 - Management Account Pre-requisites
  ##################################################
  # Privileged Role Creation
  LambdaCreateRole:
    Type: "AWS::IAM::Role"
    Condition: DeployRoles
    Properties:
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: "/"
      Policies:
        - PolicyName: self_invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunctionUrl
                  - lambda:InvokeFunction
                  - lambda:GetFunctionEventInvokeConfig
                  - lambda:GetFunction
                  - lambda:InvokeAsync
                  - lambda:GetAlias
                Resource: !Sub "arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:${OrganizationName}aws_create_role"
              - Effect: Allow
                Action:
                  - lambda:ListFunctions
                Resource: "*"
        - PolicyName: assume_role
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sts:AssumeRole
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:iam::*:role/${AcceleratorRole}
              - Effect: Allow
                Action:
                  - "organizations:Describe*"
                  - "organizations:List*"
                Resource:
                  - "*"

  InvokeCustomLambda:
    Type: Custom::InvokeCustomLambda
    Condition: DeployRoles
    Properties:
      InvokeUpdate: !Ref InvokeUpdate
      ServiceToken: !GetAtt CreateRoleLambda.Arn
      TrustPrincipal: !Sub arn:${AWS::Partition}:iam::${AuditAccountID}:root
      SwitchRole: !Ref AcceleratorRole
      RoleName: !Sub ${AccelRolePrefix}GCLambdaExecutionRole
      # YAML anchor: this block is the canonical source of truth for
      # the GCLambdaExecutionRole policy package. It is aliased into
      # ManagementAccountOrgRoleGenerator's Parameters below so the
      # steady-state new-account path in OrgRoleGenerator.yaml uses the
      # exact same policy (no drift between the bootstrap path here and
      # the EventBridge target Input over there).
      PolicyPackage: &gcLambdaExecutionRolePolicyPackage !Sub
        - |
          {
            "Docs": [{
              "Version": "2012-10-17",
                "Statement": [{
                  "Action": [
                    "acm:Describe*",
                    "acm:Get*",
                    "acm:List*",
                    "apigateway:GET",
                    "aws-marketplace:ListEntities",
                    "backup:List*",
                    "cassandra:Select",
                    "cloudfront:Describe*",
                    "cloudfront:Get*",
                    "cloudfront:List*",
                    "cloudtrail:DescribeTrails",
                    "cloudtrail:Get*",
                    "cloudtrail:ListTrails",
                    "cloudtrail:LookupEvents",
                    "codebuild:BatchGetProjects",
                    "codebuild:ListProjects",
                    "config:Describe*",
                    "config:Get*",
                    "config:PutEvaluations",
                    "dax:DescribeClusters",
                    "docdb-elastic:List*",
                    "dynamodb:DescribeTable",
                    "dynamodb:ListTables",
                    "ec2:Describe*",
                    "ec2:GetEbsEncryptionByDefault",
                    "eks:DescribeCluster",
                    "eks:ListClusters",
                    "elasticache:Describe*",
                    "elasticfilesystem:DescribeFileSystems",
                    "events:List*",
                    "guardduty:ListDetectors",
                    "iam:GenerateCredentialReport",
                    "iam:Get*",
                    "iam:List*",
                    "identitystore:ListUsers",
                    "identitystore:ListGroups",
                    "kinesis:DescribeStream",
                    "kinesis:ListStreams",
                    "memorydb:Describe*",
                    "organizations:ListTagsForResource",
                    "organizations:Describe*",
                    "organizations:List*",
                    "iam:Simulate*",
                    "iam:GetContextKeysForPrincipalPolicy",
                    "qldb:DescribeLedger",
                    "qldb:ListLedgers",
                    "rds:Describe*",
                    "resource-explorer-2:ListIndexes",
                    "resource-explorer-2:Search",
                    "sso:List*",
                    "sso:Describe*",
                    "sso:GetInlinePolicyForPermissionSet",
                    "s3:Get*",
                    "s3:GetBucketPublicAccessBlock",
                    "s3:List*",
                    "sns:GetSubscriptionAttributes",
                    "sns:GetTopicAttributes",
                    "sns:List*",
                    "tag:GetResources",
                    "timestream:DescribeEndpoints",
                    "timestream:List*",
                    "iam:Simulate*",
                    "timestream:DescribeEndpoints",
                    "timestream:List*",
                    "iam:GetContextKeysForPrincipalPolicy",
                    "iam:SimulatePrincipalPolicy",
                    "aws-marketplace:Li*",
                    "aws-marketplace:D*",
                    "s3:GetBucket*",
                    "aws-marketplace:GetResourcePolicy",
                    "aws-marketplace:ListTagsForResource",
                    "identitystore:List*",
                    "es:Describe*",
                    "es:ListDomainNames"
                  ],
                  "Resource": [
                    "*"
                  ],
                  "Effect": "Allow",
                  "Sid": "GCComplianceAllowAccess"
                },
                {
                  "Action": [
                    "s3:Get*",
                    "s3:ListBucket",
                    "s3:GetBucketPublicAccessBlock"
                  ],
                  "Resource": [
                    "arn:${AWS::Partition}:s3:::${ClientEvidenceBucket}/*",
                    "arn:${AWS::Partition}:s3:::${ClientEvidenceBucket}",
                    "arn:${AWS::Partition}:s3:::${AWSConfigConformsBucketName}/*",
                    "arn:${AWS::Partition}:s3:::${AWSConfigConformsBucketName}"
                  ],
                  "Effect": "Allow",
                  "Sid": "GcComplianceAllowBucketAccess"
                },
                {
                  "Action": [
                    "s3:ListAllMyBuckets",
                    "s3:GetBucketPublicAccessBlock"
                  ],
                  "Resource": "*",
                  "Effect": "Allow",
                  "Sid": "GcComplianceAllowListBucketAccess"
                },
                {
                  "Action": [
                    "account:GetAlternateContact"
                  ],
                  "Resource": [
                    "arn:aws:account::*:account",
                    "arn:aws:account::*:account/o-*/*"
                  ],
                  "Effect": "Allow",
                  "Sid": "AllowReadAccountInfo"
                }
              ]
            }]
          }
        - ClientEvidenceBucket:
            !If [
              GenerateEvidenceBucketName,
              !GetAtt GenerateEvidenceBucketName.EvidenceBucketName,
              !Ref EvidenceBucketName,
            ]
          AWSConfigConformsBucketName:
            !If [
              GenerateAWSConfigConformsBucketName,
              !GetAtt GenerateEvidenceBucketName.AWSConfigBucketName,
              !Ref AWSConfigConformsBucketName,
            ]

  InvokeCustomLambda2:
    Type: Custom::InvokeCustomLambda
    Condition: DeployRoles
    Properties:
      InvokeUpdate: !Ref InvokeUpdate
      ServiceToken: !GetAtt CreateRoleLambda.Arn
      TrustPrincipal: !Sub arn:${AWS::Partition}:iam::${AuditAccountID}:root
      SwitchRole: !Ref AcceleratorRole
      RoleName: !Sub ${AccelRolePrefix}GCLambdaExecutionRole2
      # YAML anchor: canonical source of truth for the
      # GCLambdaExecutionRole2 policy package. Aliased below into
      # ManagementAccountOrgRoleGenerator's Parameters so the
      # EventBridge new-account path in OrgRoleGenerator.yaml stays in
      # lockstep with this bootstrap path. See InvokeCustomLambda above.
      PolicyPackage: &gcLambdaExecutionRole2PolicyPackage |
        {
          "Docs": [{
            "Version": "2012-10-17",
            "Statement": [{
              "Action": [
                "acm:Describe*",
                "iam:Simulate*",
                "acm:Get*",
                "acm:List*",
                "apigateway:GET",
                "backup:List*",
                "cassandra:Select",
                "cloudfront:Describe*",
                "cloudfront:Get*",
                "cloudfront:List*",
                "cloudtrail:DescribeTrails",
                "cloudtrail:Get*",
                "cloudtrail:ListTrails",
                "cloudtrail:LookupEvents",
                "codebuild:BatchGetProjects",
                "codebuild:ListProjects",
                "config:Describe*",
                "config:Get*",
                "config:PutEvaluations",
                "dax:DescribeClusters",
                "docdb-elastic:ListClusters",
                "docdb-elastic:ListClusterSnapshots",
                "dynamodb:DescribeTable",
                "dynamodb:ListTables",
                "ec2:Describe*",
                "ec2:GetEbsEncryptionByDefault",
                "eks:DescribeCluster",
                "eks:ListClusters",
                "elasticache:Describe*",
                "elasticfilesystem:DescribeFileSystems",
                "elasticloadbalancing:Describe*",
                "es:Describe*",
                "es:ListDomainNames",
                "kinesis:DescribeStream",
                "kinesis:ListStreams",
                "memorydb:Describe*",
                "organizations:List*",
                "qldb:DescribeLedger",
                "qldb:ListLedgers",
                "rds:Describe*",
                "redshift:Describe*",
                "resource-explorer-2:ListIndexes",
                "resource-explorer-2:Search",
                "s3:Get*",
                "s3:GetBucketPublicAccessBlock",
                "s3:List*",
                "sns:GetTopicAttributes",
                "sns:ListTopics",
                "tag:GetResources",
                "timestream:DescribeEndpoints",
                "timestream:List*",
                "iam:GetContextKeysForPrincipalPolicy",
                "iam:SimulatePrincipalPolicy",
                "aws-marketplace:Li*",
                "aws-marketplace:D*",
                "s3:GetBucket*",
                "aws-marketplace:GetResourcePolicy",
                "aws-marketplace:ListTagsForResource",
                "identitystore:List*"

              ],
              "Resource": [
                "*"
              ],
              "Effect": "Allow",
              "Sid": "GCComplianceAllowAccess2"
            }]
          }]
        }

  CreateRoleLambda:
    Type: "AWS::Lambda::Function"
    Condition: DeployRoles
    Properties:
      FunctionName: !Sub ${OrganizationName}aws_create_role
      Code: "../../src/lambda/aws_create_role/build/CreateRoleLambda/"
      Handler: app.lambda_handler
      Role: !GetAtt LambdaCreateRole.Arn
      Runtime: !Ref PythonRuntime
      Timeout: 900

  # AWS Config setup requirements
  ConfigLambdaExecutionRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCreateLogGroup
            Action:
              - "logs:CreateLogGroup"
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
            Effect: Allow
          - Sid: AllowLogging
            Action:
              - "logs:CreateLogGroup"
              - "logs:CreateLogStream"
              - "logs:PutLogEvents"
              - "es:Describe*"
              - "identitystore:List*"

            Resource:
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${OrganizationName}gc*"
            Effect: Allow
          - Sid: AllowOrganizationsSetup
            Action:
              - "organizations:EnableAWSServiceAccess"
              - "organizations:RegisterDelegatedAdministrator"
              - "organizations:Describe*"
              - "organizations:List*"
              - "iam:Simulate*"
              - "iam:GetContextKeysForPrincipalPolicy"
            Resource: "*"
            Effect: Allow
      PolicyName: gc_setup_config_lambda_execution_role_policy
      Roles:
        - !Ref SetupAWSConfigLambdaExecutionRole

  SetupAWSConfigLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "lambda.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      Description: "Setup AWS Organizations"
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Path: "/"
      RoleName: !Sub ${RolePrefix}setup_organizations_role
      Tags:
        - Key: "Source"
          Value: "ProServe Delivery Kit"

  AWSConfigSetupLambda:
    DependsOn:
      - SetupAWSAuditManagerLambdaExecutionRole
      - ConfigLambdaExecutionRolePolicy
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${OrganizationName}aws_config_setup"
      Code: "../../src/lambda/aws_config_setup/build/AWSConfigSetupLambda/"
      Handler: app.lambda_handler
      Role: !GetAtt SetupAWSConfigLambdaExecutionRole.Arn
      Runtime: !Ref PythonRuntime
      Timeout: 90

  AWSConfigOrganizationsSetup:
    Type: Custom::AWSConfigOrganizationsSetup
    Properties:
      ServiceToken: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${OrganizationName}aws_config_setup"
      AuditAccountId: !Ref AuditAccountID
    DependsOn:
      - AWSConfigSetupLambda

  # AWS Audit Manager setup requirements
  AuditManagerLambdaExecutionRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCreateLogGroup
            Action:
              - "logs:CreateLogGroup"
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
            Effect: Allow
          - Sid: AllowLogging
            Action:
              - "logs:CreateLogGroup"
              - "logs:CreateLogStream"
              - "logs:PutLogEvents"
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${OrganizationName}gc*"
            Effect: Allow
          - Sid: AllowOrganizationsSetup
            Action:
              - "organizations:EnableAWSServiceAccess"
              - "organizations:RegisterDelegatedAdministrator"
              - "organizations:Describe*"
              - "organizations:List*"
              - "iam:Simulate*"
              - "iam:GetContextKeysForPrincipalPolicy"
            Resource: "*"
            Effect: Allow
      PolicyName: !Sub "${OrganizationName}setup_auditmanager_lambda_execution_role_policy"
      Roles:
        - !Ref SetupAWSAuditManagerLambdaExecutionRole

  SetupAWSAuditManagerLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "lambda.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      Description: "Setup AWS Audit Manager"
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSAuditManagerAdministratorAccess
      Path: "/"
      RoleName: !Sub ${RolePrefix}setup_auditmanager_role
      Tags:
        - Key: "Source"
          Value: "ProServe Delivery Kit"

  AWSAuditManagerSetupLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${OrganizationName}aws_auditmanager_setup"
      Code: "../../src/lambda/aws_auditmanager_setup/build/AWSAuditManagerSetupLambda/"
      Handler: app.lambda_handler
      Role: !GetAtt SetupAWSAuditManagerLambdaExecutionRole.Arn
      Runtime: !Ref PythonRuntime
      Timeout: 90

  AWSAuditManagerOrganizationsSetup:
    Type: Custom::AWSAuditManagerOrganizationsSetup
    Properties:
      ServiceToken: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${OrganizationName}aws_auditmanager_setup"
      AuditAccountId: !Ref AuditAccountID
    DependsOn:
      - AWSAuditManagerSetupLambda

  # Generate names for the evidence and AWS Config Conforms buckets
  GenerateEvidenceBucketNameLambda:
    Type: AWS::Lambda::Function
    Condition: GenerateEvidenceBucketName
    Properties:
      FunctionName: !Sub "${OrganizationName}aws_generate_bucket_name"
      Code: "../../src/lambda/aws_generate_bucket_name/build/GenerateEvidenceBucketNameLambda/"
      Handler: app.lambda_handler
      Role: !GetAtt SetupAWSAuditManagerLambdaExecutionRole.Arn
      Runtime: !Ref PythonRuntime
      Timeout: 90

  # OpenSearch Access
  GCLambdaExecutionRoleOpenSearchPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowOpenSearchAccess
            Action:
              - "es:Desc*"
            Resource:
              - "*"
            Effect: Allow
      PolicyName: !Sub "${OrganizationName}GCLambdaExecutionRoleOpenSearchPolicy"
      Roles:
        - !Ref GCLambdaExecutionRole2
  
  # MarketPlace Access
  GCLambdaExecutionRoleMarketPlacePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowMarketPlaceAccess
            Action:
              - "aws-marketplace:Li*"
            Resource:
              - "*"
            Effect: Allow
      PolicyName: !Sub "${OrganizationName}GCLambdaExecutionRoleMarketPlacePolicy"
      Roles:
        - !Ref GCLambdaExecutionRole2
  GenerateEvidenceBucketName:
    Type: Custom::GenerateEvidenceBucketName
    Condition: GenerateEvidenceBucketName
    Properties:
      ServiceToken: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${OrganizationName}aws_generate_bucket_name"
      AuditAccountId: !Ref AuditAccountID
    DependsOn:
      - GenerateEvidenceBucketNameLambda

  EvidenceBucketSSMParam:
    Type: AWS::SSM::Parameter
    Properties:
      Description: Name of the Evidence Bucket
      # unique ssm param key
      Name: "/gc_guardrails/s3/evidence_bucket"
      Type: String
      Value:
        !If [
          GenerateEvidenceBucketName,
          !GetAtt GenerateEvidenceBucketName.EvidenceBucketName,
          !Ref EvidenceBucketName,
        ]

  AWSConfigBucketSSMParam:
    Type: AWS::SSM::Parameter
    Properties:
      Description: Name of the AWS Config Bucket
      # unique ssm param key
      Name: "/gc_guardrails/s3/aws_config_bucket"
      Type: String
      Value:
        !If [
          GenerateAWSConfigConformsBucketName,
          !GetAtt GenerateEvidenceBucketName.AWSConfigBucketName,
          !Ref AWSConfigConformsBucketName,
        ]

  ##################################################
  # Partition State — DynamoDB Table + Partitioner
  ##################################################

  PartitionStateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain          # survive a `cfn delete-stack` on the root
    UpdateReplacePolicy: Retain     # survive a replacement update
    Properties:
      TableName: !Sub "${OrganizationName}-gc-guardrails-partition-state"
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true   # block accidental console / CLI deletes
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true   # 35-day continuous backup
      AttributeDefinitions:
        - AttributeName: AccountId
          AttributeType: S
      KeySchema:
        - AttributeName: AccountId
          KeyType: HASH
      # Cross-account read access for the audit-account permissions Lambda `aws_lambda_permissions_setup`.
      ResourcePolicy:
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: AllowAuditAccountPermissionsLambdaRead
              Effect: Allow
              Principal:
                AWS:
                  - !Sub "arn:${AWS::Partition}:iam::${AuditAccountID}:root"
              Action:
                - "dynamodb:Scan"
                - "dynamodb:GetItem"
              Resource: "*"

  AccountPartitionerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${OrganizationName}AccountPartitionerRole"
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: "/"
      Policies:
        - PolicyName: AllowOrganizationsRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowOrganizationsRead
                Effect: Allow
                Action:
                  - "organizations:ListAccounts"
                  - "organizations:DescribeOrganization"
                Resource: "*"
        - PolicyName: AllowDynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowDynamoDBAccess
                Effect: Allow
                Action:
                  - "dynamodb:PutItem"
                  - "dynamodb:DeleteItem"
                  - "dynamodb:Scan"
                  - "dynamodb:GetItem"
                Resource:
                  - !GetAtt PartitionStateTable.Arn

  AccountPartitionerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${OrganizationName}aws_account_partitioner"
      Description: Partitions organization accounts into groups of ≤MaxAccountsPerPartition for guardrail Lambda cloning
      Handler: app.lambda_handler
      Runtime: !Ref PythonRuntime
      Timeout: 180
      MemorySize: 128
      Role: !GetAtt AccountPartitionerRole.Arn
      Code: "../../src/lambda/aws_account_partitioner/build/AccountPartitionerLambda/"
      Environment:
        Variables:
          PARTITION_TABLE_NAME: !Ref PartitionStateTable
          MAX_ACCOUNTS_PER_PARTITION: !Ref MaxAccountsPerPartition
          MAX_PARTITIONS: !Ref MaxPartitions

  InvokeAccountPartitioner:
    Type: Custom::AccountPartitioner
    Properties:
      ServiceToken: !GetAtt AccountPartitionerLambda.Arn
      InvokeUpdate: !Ref InvokeUpdate

