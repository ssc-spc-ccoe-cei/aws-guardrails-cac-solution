        Statement:
          - Sid: S3
            Action:
              - "s3:ListAllMyBuckets"
              - "s3:ListBucket"
              - "s3:GetBucketPolicy"
            Resource: "*"
            Effect: Allow
          - Sid: AllowRedshift
            Action:
              - "redshift:DescribeClusters"
              - "redshift:DescribeClusterParameters"
            Resource: 
              - !Sub "arn:${AWS::Partition}:redshift:*:*:cluster:*"
              - !Sub "arn:${AWS::Partition}:redshift:*:*:parametergroup:*"
            Effect: Allow
          - Sid: AllowAPI
            Action:
              - "apigateway:GET"
            Resource: "*"
            Effect: Allow
          - Sid: AllowELB
            Action:
              - "elasticloadbalancing:Describe*"
