              - "memorydb:DescribeSnapshots"
              - "qldb:DescribeLedger"
              - "qldb:ListLedgers"
              - "rds:DescribeDBClusters"
              - "rds:DescribeDBClusterSnapshots"
              - "rds:DescribeDBInstances"
              - "rds:DescribeDBSnapshots"
              - "resource-explorer-2:ListIndexes"
              - "resource-explorer-2:Search"
              - "s3:GetBucketLocation"
              - "s3:GetBucketPolicy"
              - "s3:GetEncryptionConfiguration"
              - "s3:ListAllMyBuckets"
              - "s3:ListBucket"
              - "s3:GetBucketPublicAccessBlock"
              - "s3:GetBucketTagging"
              - "sso:ListInstances"
              - "identitystore:ListUsers"
              - "identitystore:ListGroups"
              - "sso:ListManagedPoliciesInPermissionSet"
              - "sso:ListAccountAssignmentsForPrincipal"
              - "sso:Describe*"
              - "sso:GetInlinePolicyForPermissionSet"
              - "sso:ListCustomerManagedPolicyReferencesInPermissionSet"
              - "sso:ListPermissionSetsProvisionedToAccount"
              - "sso:ListAccountAssignments"
              - "sso:ListPermissionSets"
              - "sns:GetSubscriptionAttributes"
              - "sns:GetTopicAttributes"
              - "sns:ListSubscriptionsByTopic"
              - "sns:ListTopics"
              - "tag:GetResources"
              - "timestream:DescribeEndpoints"
              - "timestream:ListDatabases"
              - "timestream:ListTables"
            Resource: "*"
            Effect: Allow
      PolicyName: !Sub "${OrganizationName}GCLambdaExecutionRoleDatastorePolicy"
      Roles:
        - !Ref GCLambdaExecutionRole
        - !Ref GCLambdaExecutionRole2

  # Account Access
  GCLambdaExecutionRoleAccountPolicy:
    Condition: DeployRoles
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowReadAccountInfo
            Action:
              - "account:GetAlternateContact"
            Resource:
              - !Sub "arn:${AWS::Partition}:account::*:account"
              - !Sub "arn:${AWS::Partition}:account::*:account/o-*/*"
            Effect: Allow
      PolicyName: GCLambdaExecutionRoleAccountPolicy
      Roles:
        - !Ref GCLambdaExecutionRole

  # CloudTrail Access
  GCLambdaExecutionRoleCloudTrailPolicy:
    Condition: DeployRoles
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudTrailChecks
            Action:
              - "cloudtrail:DescribeTrails"
              - "cloudtrail:GetEventSelectors"
              - "cloudtrail:GetTrail"
              - "cloudtrail:GetTrailStatus"
              - "cloudtrail:ListTrails"
              - "cloudtrail:LookupEvents"
            Resource:
              - "*"
            Effect: Allow
      PolicyName: !Sub "${OrganizationName}GCLambdaExecutionRoleCloudTrailPolicy"
      Roles:
        - !Ref GCLambdaExecutionRole
        - !Ref GCLambdaExecutionRole2

  # Marketplace Access
  GCLambdaExecutionRoleMarketplacePolicy:
    Condition: DeployRoles
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowMarketplaceChecks
            Action:
              - "aws-marketplace:ListEntities"
            Resource:
              - "*"
            Effect: Allow
      PolicyName: !Sub "${OrganizationName}GCLambdaExecutionRoleMarketplacePolicy"
      Roles:
        - !Ref GCLambdaExecutionRole

  # Organizations Access
  GCLambdaExecutionRoleOrganizationsPolicy:
    Condition: DeployRoles
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowOrganizationsChecks
            Action:
              - "organizations:Describe*"
              - "organizations:List*"
            Resource:
              - "*"
            Effect: Allow
      PolicyName: !Sub "${OrganizationName}GCLambdaExecutionRoleOrganizationsPolicy"
      Roles:
        - !Ref GCLambdaExecutionRole
        - !Ref GCLambdaExecutionRole2

  # IAM Access
  GCLambdaExecutionRoleCloudFrontPolicy:
    Condition: DeployRoles
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontQueries
            Action:
              - "cloudfront:Describe*"
              - "cloudfront:Get*"
              - "cloudfront:List*"
            Resource:
              - "*"
            Effect: Allow
      PolicyName: !Sub "${OrganizationName}GCLambdaExecutionRoleCloudFrontPolicy"
      Roles:
        - !Ref GCLambdaExecutionRole
        - !Ref GCLambdaExecutionRole2

  # ACM Accessdescribe_domain
  GCLambdaExecutionRoleAcmPolicy:
    Condition: DeployRoles
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAcmQueries
            Action:
              - "acm:Describe*"
              - "acm:Get*"
              - "acm:List*"
            Resource:
              - "*"
            Effect: Allow
      PolicyName: !Sub "${OrganizationName}GCLambdaExecutionRoleAcmPolicy"
      Roles:
        - !Ref GCLambdaExecutionRole
        - !Ref GCLambdaExecutionRole2

  #######################################################
  # Part 4 - Conformance Pack (partitioned)
  #######################################################
  # Up to 3 Organization Conformance Packs are deployed, one per
  # partition produced by ``aws_account_partitioner``. Each pack reuses
  # ConformancePack.yaml in S3 with a different ``PartitionSuffix``
  # (``""`` / ``"_p2"`` / ``"_p3"``) so its Config rules invoke the
  # matching guardrail Lambda clones. The ``ExcludedAccounts`` list on
  # each pack guarantees every org account receives exactly one pack —
  # the one for the partition it is assigned to. See
  # ConformancePackPartitions.yaml for the full set of resources and
  # conditions.
  ConformancePack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - AuditAccountPreRequisitesPart1
      - AuditAccountPreRequisitesPart2
      - AuditAccountPreRequisitesPart3
      - AuditAccountPreRequisitesPart4
      - AuditAccountPreRequisitesPart5
      - AuditAccountPreRequisitesPart6
      - AuditAccountPreRequisitesPart7
      - AuditAccountPreRequisitesPart8
      - AuditAccountPreRequisitesPartN
      #- AllAccountPreRequisites
    Properties:
      TemplateURL: !Sub https://${PipelineBucket}.s3.${AWS::Region}.amazonaws.com/${DeployVersion}/ConformancePackPartitions.yaml
      Parameters:
        # Per-partition account lists from the partitioner. Each pack's
        # presence is driven entirely by whether its list is non-empty;
        # the parent ``PartitionCount`` is not consumed here.
        AccountsInP1: !GetAtt InvokeAccountPartitioner.AccountsInP1
        AccountsInP2: !GetAtt InvokeAccountPartitioner.AccountsInP2
        AccountsInP3: !GetAtt InvokeAccountPartitioner.AccountsInP3
        # Wiring / packaging
        PipelineBucket: !Ref PipelineBucket
        DeployVersion: !Ref DeployVersion
        InvokeUpdate: !Ref InvokeUpdate
        # Shared inputs forwarded to each pack
        OrganizationName: !Ref OrganizationName
        AccelRolePrefix: !Ref AccelRolePrefix
        AuditAccountID: !Ref AuditAccountID
        BGA1: !Ref BGA1
        BGA2: !Ref BGA2
        BGA3: !Ref BGA3
        BGA4: !Ref BGA4
        LogArchiveAccountName: !Ref LogArchiveAccountName
        ClientEvidenceBucket:
          !If [
            GenerateEvidenceBucketName,
            !GetAtt GenerateEvidenceBucketName.EvidenceBucketName,
            !Ref EvidenceBucketName,
          ]
        GC04EnterpriseMonitoringIAMRoleName: !Ref GC04EnterpriseMonitoringIAMRoleName
        GC04EnterpriseMonitoringIAMTrustedPrincipal: !Ref GC04EnterpriseMonitoringIAMTrustedPrincipal
        # GC03AlarmList is intentionally not passed in here — the nested
        # stack defaults it to the canonical alarm-name list. Override
        # there if it ever needs to change.

  #######################################################
  # Part 5 - Audit Manager Components
  #######################################################
  AuditAccountAuditManager:
    Type: AWS::CloudFormation::StackSet
    DependsOn:
      - AWSAuditManagerOrganizationsSetup
      - ConformancePack
      - AuditAccountPreRequisitesPart1
      - AuditAccountPreRequisitesPart2
      - AuditAccountPreRequisitesPart3
      - AuditAccountPreRequisitesPart4
      - AuditAccountPreRequisitesPart5
      - AuditAccountPreRequisitesPart6
      - AuditAccountPreRequisitesPart7
      - AuditAccountPreRequisitesPart8
      - AuditAccountPreRequisitesPartN
      #- AllAccountPreRequisites
    Properties:
      AutoDeployment:
        Enabled: true
        RetainStacksOnAccountRemoval: false
      Capabilities:
        - CAPABILITY_IAM
        - CAPABILITY_NAMED_IAM
      Description: GC Guardrails Assessment - Audit Manager resources
      ManagedExecution:
        Active: true
      OperationPreferences:
        FailureToleranceCount: 0
        MaxConcurrentCount: 1
        RegionOrder:
          - ca-central-1
      Parameters:
        - ParameterKey: OrganizationName
          ParameterValue: !Ref OrganizationName
        - ParameterKey: AuditAccountID
          ParameterValue: !Ref AuditAccountID
        - ParameterKey: EvidenceBucketName
          ParameterValue:
            !If [
              GenerateEvidenceBucketName,
              !GetAtt GenerateEvidenceBucketName.EvidenceBucketName,
              !Ref EvidenceBucketName,
            ]
        - ParameterKey: AdditionalAssessmentAdminRoleARN
          ParameterValue: !Ref AdditionalAssessmentAdminRoleARN
        - ParameterKey: RolePrefix
          ParameterValue: !Ref RolePrefix
        - ParameterKey: DeployVersion
          ParameterValue: !Ref DeployVersion
        # Forwarded so the AWSAuditManagerSetup Custom Resource is re-invoked
        # with RequestType: Update on every deploy (the root stack's
        # InvokeUpdate UUID is bumped on each `make deploy` and on every
        # partition-sync cascade).
        - ParameterKey: InvokeUpdate
          ParameterValue: !Ref InvokeUpdate
      PermissionModel: SERVICE_MANAGED
      StackInstancesGroup:
        - DeploymentTargets:
            OrganizationalUnitIds:
              - !Ref SecurityOUID
          Regions:
            - ca-central-1
      StackSetName: !Sub "${OrganizationName}-GC-AuditAccount-AuditManager"
      Tags:
        - Key: Source
          Value: "ProServe Delivery Kit"
      TemplateURL: !Sub https://${PipelineBucket}.s3.${AWS::Region}.amazonaws.com/${DeployVersion}/AuditAccountAuditManager.yaml

  #######################################################
  # Part 6 - Evidence Collection Components
  #######################################################
  EvidenceCollectionComponents:
    Type: AWS::CloudFormation::StackSet
    DependsOn:
      - AuditAccountAuditManager
    Properties:
      AutoDeployment:
        Enabled: true
        RetainStacksOnAccountRemoval: false
      Capabilities:
        - CAPABILITY_IAM
        - CAPABILITY_NAMED_IAM
      Description: GC Guardrails Assessment - Evidence Collection
      ManagedExecution:
        Active: true
      OperationPreferences:
        FailureToleranceCount: 0
        MaxConcurrentCount: 1
        RegionOrder:
          - ca-central-1
      Parameters:
        - ParameterKey: AuditAccountID
          ParameterValue: !Ref AuditAccountID
        - ParameterKey: DefaultCloudProfile
          ParameterValue: !Ref DefaultCloudProfile
        - ParameterKey: DeployVersion
          ParameterValue: !Ref DeployVersion
        - ParameterKey: DestBucketName
          ParameterValue: !Ref DestBucketName
        - ParameterKey: ExecutionName
          ParameterValue: !Ref ExecutionName
        - ParameterKey: OrganizationId
          ParameterValue: !Ref OrganizationId
        - ParameterKey: OrganizationName
          ParameterValue: !Ref OrganizationName
        - ParameterKey: TenantId
          ParameterValue: !Ref TenantId
      PermissionModel: SERVICE_MANAGED
      StackInstancesGroup:
        - DeploymentTargets:
            OrganizationalUnitIds:
              - !Ref SecurityOUID
            # Accounts:
            #   - !Ref AuditAccountID
          Regions:
            - ca-central-1
      StackSetName: !Sub "${OrganizationName}-GC-AuditAccount-EvidenceCollection"
      Tags:
        - Key: Source
          Value: "ProServe Delivery Kit"
      TemplateURL: !Sub https://${PipelineBucket}.s3.${AWS::Region}.amazonaws.com/${DeployVersion}/EvidenceCollectionComponents.yaml
  #######################################################
  # Part 7 - Role creation components
  #######################################################
  ManagementAccountOrgRoleGenerator:
    Type: AWS::CloudFormation::StackSet
    Properties:
      TemplateURL: !Sub https://${PipelineBucket}.s3.${AWS::Region}.amazonaws.com/${DeployVersion}/OrgRoleGenerator.yaml
      #      AutoDeployment:
      #        Enabled: true
      #        RetainStacksOnAccountRemoval: false
      Capabilities:
        - CAPABILITY_IAM
        - CAPABILITY_NAMED_IAM
      Description: Compliance Dashboard - Org Role Generation
      CallAs: SELF
      ManagedExecution:
        Active: true
      OperationPreferences:
        FailureToleranceCount: 0
        MaxConcurrentCount: 1
        RegionOrder:
          - us-east-1
      Parameters:
        - ParameterKey: OrganizationName
          ParameterValue: !Ref OrganizationName
        - ParameterKey: AuditAccountID
          ParameterValue: !Ref AuditAccountID
        - ParameterKey: AccelRolePrefix
          ParameterValue: !Ref AccelRolePrefix
        - ParameterKey: RolePrefix
          ParameterValue: !Ref RolePrefix
        - ParameterKey: AcceleratorRole
          ParameterValue: !Ref AcceleratorRole
        # YAML-alias the SAME policy package values used by
        # InvokeCustomLambda / InvokeCustomLambda2 above. The CFN engine
        # resolves both the bootstrap (this stack) and steady-state
        # (EventBridge target Input in OrgRoleGenerator.yaml) paths from
        # one source — eliminating the drift that previously left newly
        # onboarded accounts with a strictly weaker GCLambdaExecutionRole.
        # Bucket-specific ARNs (${ClientEvidenceBucket} /
        # ${AWSConfigConformsBucketName}) are already `!Sub`-resolved
        # inside the anchored block, so OrgRoleGenerator.yaml no longer
        # needs to receive the bucket names separately.
        - ParameterKey: GCLambdaExecutionRolePolicyPackage
          ParameterValue: *gcLambdaExecutionRolePolicyPackage
        - ParameterKey: GCLambdaExecutionRole2PolicyPackage
          ParameterValue: *gcLambdaExecutionRole2PolicyPackage
      PermissionModel: SELF_MANAGED # SERVICE_MANAGED
      StackInstancesGroup:
        - DeploymentTargets:
            Accounts:
              - !Sub ${AWS::AccountId}
          Regions:
            - us-east-1
      StackSetName: !Sub "${OrganizationName}-Compliance-Role-Generator"

  #######################################################
  # Partition-sync orchestration (factored out)
  #
  # Post-deployment, an EventBridge cron fires every 6 hours and starts
  # the gc-guardrails-partition-sync Step Function defined in
  # PartitionSyncStateMachine.yaml. See PartitionSyncStateMachine.yaml and
  # doc/RESOURCE_POLICY_FIX.md for the full state-machine design.
  #######################################################

  # CloudFormation service role handed to UpdateStack by the partition-sync Step Function. 
  CloudFormationDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${OrganizationName}CloudFormationDeploymentRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Path: "/"
      Policies:
        # ------------------------------------------------------------------
        # 1) CloudFormation + S3 (nested stacks, StackSets, template fetch)
        # ------------------------------------------------------------------
        - PolicyName: StacksAndTemplates
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CfnRootAndNestedStacks
                Effect: Allow
                Action:
                  - "cloudformation:*"
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${RootStackName}/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${RootStackName}-*/*"
              - Sid: CfnStackSets
                Effect: Allow
                Action:
                  - "cloudformation:*"
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stackset/${OrganizationName}*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stackset-target/${OrganizationName}*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:*::type/resource/*"
              - Sid: CfnMisc
                Effect: Allow
                Action:
                  - "cloudformation:ListStackSetAutoDeploymentTargets"
                  - "cloudformation:DescribeType"
                  - "cloudformation:ListTypes"
                  - "cloudformation:ValidateTemplate"
                  - "cloudformation:GetTemplateSummary"
                Resource: "*"
              - Sid: PipelineBucketRead
                # CFN fetches nested stack templates and packaged Lambda code from the
                # pipeline bucket using the caller's (this role's) credentials.
                Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:GetObjectVersion"
                  - "s3:ListBucket"
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${PipelineBucket}"
                  - !Sub "arn:${AWS::Partition}:s3:::${PipelineBucket}/*"
        # ------------------------------------------------------------------
        # 2) IAM (roles + attached inline/managed policies + PassRole)
        # ------------------------------------------------------------------
        - PolicyName: IamRolesAndPolicies
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageStackRoles
                Effect: Allow
                Action:
                  - "iam:GetRole"
                  - "iam:CreateRole"
                  - "iam:DeleteRole"
                  - "iam:UpdateRole"
                  - "iam:UpdateAssumeRolePolicy"
                  - "iam:PutRolePolicy"
                  - "iam:GetRolePolicy"
                  - "iam:DeleteRolePolicy"
                  - "iam:ListRolePolicies"
                  - "iam:AttachRolePolicy"
                  - "iam:DetachRolePolicy"
                  - "iam:ListAttachedRolePolicies"
                  - "iam:TagRole"
                  - "iam:UntagRole"
                  - "iam:ListRoleTags"
                  - "iam:PutRolePermissionsBoundary"
                  - "iam:DeleteRolePermissionsBoundary"
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${RootStackName}*"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${OrganizationName}*"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${RolePrefix}*"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AccelRolePrefix}*"
                  # Legacy unprefixed role names created by main.yaml today:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/GCLambdaExecutionRoleAccountPolicy"
              - Sid: ReadAwsManagedPolicies
                Effect: Allow
                Action:
                  - "iam:GetPolicy"
                  - "iam:GetPolicyVersion"
                  - "iam:ListPolicyVersions"
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::aws:policy/*"
                  - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/*"
              - Sid: PassRolesCreatedByThisStack
                # PassRole is required for Lambda functions (Role property),
                # Step Functions (RoleArn), EventBridge rules (RoleArn),
                # and the state machine handing this very role back to CFN.
                Effect: Allow
                Action:
                  - "iam:PassRole"
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${OrganizationName}*"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${RolePrefix}*"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AccelRolePrefix}*"
                Condition:
                  StringEquals:
                    "iam:PassedToService":
                      - lambda.amazonaws.com
                      - states.amazonaws.com
                      - events.amazonaws.com
                      - cloudformation.amazonaws.com
                      - config.amazonaws.com
              - Sid: ServiceLinkedRolesForStackSets
                # SERVICE_MANAGED StackSets rely on org-wide SLRs. CFN may
                # need to create the AWSServiceRoleForCloudFormationStackSets
                # variants on first use.
                Effect: Allow
                Action:
                  - "iam:CreateServiceLinkedRole"
                Resource: "*"
                Condition:
                  StringLike:
                    "iam:AWSServiceName":
                      - "stacksets.cloudformation.amazonaws.com"
                      - "member.org.stacksets.cloudformation.amazonaws.com"
                      - "config.amazonaws.com"
                      - "config-multiaccountsetup.amazonaws.com"
                      - "auditmanager.amazonaws.com"
              - Sid: EnableTrustedAccessForConfig
                Effect: Allow
                Action:
                  - "organizations:EnableAWSServiceAccess"
                  - "organizations:ListAWSServiceAccessForOrganization"
                Resource: "*"
                Condition:
                  StringEquals:
                    "organizations:ServicePrincipal":
                      - "config.amazonaws.com"
                      - "config-multiaccountsetup.amazonaws.com"
        # ------------------------------------------------------------------
        # 3) Compute + data plane (Lambda, DynamoDB, Logs, StepFn, Events)
        # ------------------------------------------------------------------
        - PolicyName: ComputeAndData
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageStackLambdas
                Effect: Allow
                Action:
                  - "lambda:*"
                Resource:
                  - !Sub "arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:${OrganizationName}*"
              - Sid: ManagePartitionStateTable
                # DeletionPolicy: Retain means CreateTable/DeleteTable are not
                # expected on updates — only Describe/Update/Tag/PITR ops.
                Effect: Allow
                Action:
                  - "dynamodb:*"
                Resource:
                  - !Sub "arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/${OrganizationName}-gc-guardrails-partition-state"
              - Sid: ManageStackLogGroups
                Effect: Allow
                Action:
                  - "logs:*"
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/${OrganizationName}*"
                  - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/${OrganizationName}*:*"
                  - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/vendedlogs/states/${OrganizationName}*"
                  - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/vendedlogs/states/${OrganizationName}*:*"
              - Sid: DescribeLogs
                Effect: Allow
                Action:
                  - "logs:DescribeLogGroups"
                  - "logs:DescribeLogStreams"
                Resource: "*"
              - Sid: ManageStepFunctions
                Effect: Allow
                Action:
                  - "states:*"
                Resource:
                  - !Sub "arn:${AWS::Partition}:states:*:${AWS::AccountId}:stateMachine:${OrganizationName}*"
              - Sid: ManageEventBridgeRules
                Effect: Allow
                Action:
                  - "events:*"
                Resource:
                  - !Sub "arn:${AWS::Partition}:events:*:${AWS::AccountId}:rule/${OrganizationName}*"
        # ------------------------------------------------------------------
        # 4) Config + SSM + Organizations reads (needed by StackSet SERVICE_MANAGED)
        # ------------------------------------------------------------------
        - PolicyName: ConfigSsmAndOrgs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageOrganizationConformancePacks
                # Config doesn't support resource-level scoping for these APIs.
                Effect: Allow
                Action:
                  - "config:DescribeOrganizationConformancePacks"
                  - "config:DescribeOrganizationConformancePackStatuses"
                  - "config:GetOrganizationConformancePackDetailedStatus"
                  - "config:PutOrganizationConformancePack"
                  - "config:DeleteOrganizationConformancePack"
                  - "config:TagResource"
                  - "config:UntagResource"
                  - "config:ListTagsForResource"
                Resource: "*"
              - Sid: ManageStackSsmParams
                Effect: Allow
                Action:
                  - "ssm:GetParameter"
                  - "ssm:GetParameters"
                  - "ssm:PutParameter"
                  - "ssm:DeleteParameter"
                  - "ssm:DescribeParameters"
                  - "ssm:AddTagsToResource"
                  - "ssm:RemoveTagsFromResource"
                  - "ssm:ListTagsForResource"
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/gc_guardrails/*"
              - Sid: OrganizationsReadForStackSets
                # SERVICE_MANAGED StackSets and OrganizationConformancePacks
                # both call these to enumerate target accounts and OUs.
                Effect: Allow
                Action:
                  - "organizations:DescribeOrganization"
                  - "organizations:ListAccounts"
                  - "organizations:ListAccountsForParent"
                  - "organizations:ListRoots"
                  - "organizations:ListParents"
                  - "organizations:ListChildren"
                  - "organizations:ListOrganizationalUnitsForParent"
                  - "organizations:DescribeAccount"
                  - "organizations:DescribeOrganizationalUnit"
                  - "organizations:ListDelegatedAdministrators"
                  - "organizations:ListDelegatedServicesForAccount"
                  - "organizations:ListAWSServiceAccessForOrganization"
                Resource: "*"
  PartitionSyncStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - AccountPartitionerLambda
    Properties:
      TemplateURL: !Sub https://${PipelineBucket}.s3.${AWS::Region}.amazonaws.com/${DeployVersion}/PartitionSyncStateMachine.yaml
      Parameters:
        OrganizationName: !Ref OrganizationName
        RootStackName: !Ref RootStackName
        # Needed for State Machine to construct the cross-account ARN for the permissions Lambda's lambda:InvokeFunction.
        AuditAccountID: !Ref AuditAccountID
        # Passed to UpdateStack as RoleARN so CFN uses this admin-scoped
        # service role for resource ops, not the narrow state machine role.
        CloudFormationDeploymentRoleArn: !GetAtt CloudFormationDeploymentRole.Arn

Outputs:
  ClientEvidenceBucket:
    Description: Amazon S3 bucket where evidence documents should be uploaded to
    Value:
      !If [
        GenerateEvidenceBucketName,
        !GetAtt GenerateEvidenceBucketName.EvidenceBucketName,
        !Ref EvidenceBucketName,
      ]
