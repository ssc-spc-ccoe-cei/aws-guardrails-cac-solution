              - "*"
            Effect: Allow
          - Sid: AllowES
            Action:
              - "es:ListDomainNames"
              - "es:DescribeDomain"
              - "es:DescribeElasticsearchDomain"
            Resource: "*"
            Effect: Allow
          - Sid: AllowReadTags
