AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Standalone test stack for aws_account_partitioner Lambda + DynamoDB table.
  Deploy this to a sandbox account to validate partition logic in isolation.

Parameters:
  MaxAccountsPerPartition:
    Type: String
    Default: "70"
    Description: Max accounts per partition (use a small number like 3 for testing)
  MaxPartitions:
    Type: String
    Default: "3"
    Description: Maximum number of partitions allowed
  CodeBucket:
    Type: String
    Description: S3 bucket containing the packaged Lambda code
  CodeKey:
    Type: String
    Default: "aws_account_partitioner.zip"
    Description: S3 key for the Lambda zip package

Resources:
  PartitionStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: gc-guardrails-partition-state-test
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: AccountId
          AttributeType: S
      KeySchema:
        - AttributeName: AccountId
          KeyType: HASH

  AccountPartitionerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: test-AccountPartitionerRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AllowOrganizationsRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "organizations:ListAccounts"
                  - "organizations:DescribeOrganization"
                Resource: "*"
        - PolicyName: AllowDynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "dynamodb:PutItem"
                  - "dynamodb:DeleteItem"
                  - "dynamodb:Scan"
                  - "dynamodb:GetItem"
                Resource: !GetAtt PartitionStateTable.Arn

  AccountPartitionerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: test-aws_account_partitioner
      Description: "Test - Partitions org accounts into groups for guardrail Lambda cloning"
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 180
      MemorySize: 128
      Role: !GetAtt AccountPartitionerRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          PARTITION_TABLE_NAME: !Ref PartitionStateTable
          MAX_ACCOUNTS_PER_PARTITION: !Ref MaxAccountsPerPartition
          MAX_PARTITIONS: !Ref MaxPartitions

  # Invokes the partitioner as a Custom Resource at deploy time
  InvokeAccountPartitioner:
    Type: Custom::AccountPartitioner
    Properties:
      ServiceToken: !GetAtt AccountPartitionerLambda.Arn

Outputs:
  PartitionCount:
    Description: Number of partitions created
    Value: !GetAtt InvokeAccountPartitioner.PartitionCount
  PartitionsChanged:
    Description: Whether partition count changed from previous state
    Value: !GetAtt InvokeAccountPartitioner.PartitionsChanged
  TableName:
    Description: DynamoDB table name
    Value: !Ref PartitionStateTable
  LambdaArn:
    Description: Partitioner Lambda ARN
    Value: !GetAtt AccountPartitionerLambda.Arn
