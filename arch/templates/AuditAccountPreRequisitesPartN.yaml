AWSTemplateFormatVersion: 2010-09-09
Description: Configures AWS Config and AWS Audit Manager for multi-account management.

Parameters:
  OrganizationName:
    Type: String
    Default: ''
    Description: The name of the organization. Used as a prefix in resource names.
  AuditAccountID:
    Type: String
    Default: ''
    Description: 12-digit AWS Account ID (e.g., '222222222222')
  RolePrefix:
    Type: String
    Default: ''
    Description: Role name prefix
  PythonRuntime:
    Type: String
    Default: python3.12
    Description: The python runtime to use for the compliance dashboard
  PartitionStateTableName:
    Type: String
    Default: gc-guardrails-partition-state
    Description: |
      DynamoDB table (written by aws_account_partitioner) mapping each active AWS account to its partition. Consumed by aws_lambda_permissions_setup to sync each guardrail Lambda clone's resource-based policy.
  PartitionStateTableAccountId:
    Type: String
    Default: ''
    Description: |
      12-digit AWS account ID that owns the PartitionStateTable. Leave empty for same-account deployments (the Lambda will fall back to the bare table name).

Conditions:
  IsAuditAccount: !Equals
    - !Ref AWS::AccountId
    - !Ref AuditAccountID
  HasCrossAccountPartitionTable: !Not
    - !Equals
      - !Ref PartitionStateTableAccountId
      - ''
  IsAuditAccountAndCrossAccountTable: !And
    - !Condition IsAuditAccount
    - !Condition HasCrossAccountPartitionTable

Resources:
  #############################################
  # Configure Lambda Permissions
  #############################################
  LambdaPermissionsExecutionRolePolicy:
    Condition: IsAuditAccount
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCreateLogGroup
            Action:
              - logs:CreateLogGroup
            Resource:
              - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*
            Effect: Allow
          - Sid: AllowLogging
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${OrganizationName}gc*
            Effect: Allow
          - Sid: AllowLambdaPermissions
            Action:
              - lambda:AddPermission
              - lambda:RemovePermission
              - lambda:GetPolicy
              - lambda:GetFunction
            Resource:
              - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${OrganizationName}gc*
            Effect: Allow
          - Sid: AllowDynamoDBReadPartitionState
            Action:
              - dynamodb:Scan
              - dynamodb:GetItem
            Resource:
              - !If
                - HasCrossAccountPartitionTable
                - !Sub arn:aws:dynamodb:${AWS::Region}:${PartitionStateTableAccountId}:table/${PartitionStateTableName}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PartitionStateTableName}
            Effect: Allow
      PolicyName: gc_setup_lambda_execution_role_policy
      Roles:
        - !Ref LambdaPermissionsExecutionRole

  LambdaPermissionsExecutionRole:
    Condition: IsAuditAccount
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Description: Setup Lambda Permissions
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Path: /
      RoleName: !Sub ${RolePrefix}setup_lambda_permissions_role
      Tags:
        - Key: Source
          Value: Proserve Delivery Kit

  LambdaPermissionsSetup:
    Condition: IsAuditAccount
    Type: Custom::LambdaPermissionsSetup
    Properties:
      ServiceToken: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${OrganizationName}aws_lambda_permissions_setup
      UpdateVariable: QVdTb21lCg8
      TriggerProperty: 40
    DependsOn:
      - LambdaPermissionsLambda

  LambdaPermissionsLambda:
    Condition: IsAuditAccount
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${OrganizationName}aws_lambda_permissions_setup
      Code: ../../src/lambda/aws_lambda_permissions_setup/build/LambdaPermissionsLambda/
      Handler: app.lambda_handler
      Role: !GetAtt LambdaPermissionsExecutionRole.Arn
      Runtime: !Ref PythonRuntime
      Timeout: 600
      Environment:
        Variables:
          OrganizationName: !Ref OrganizationName
          PARTITION_TABLE_NAME: !Ref PartitionStateTableName
          PARTITION_TABLE_ACCOUNT_ID: !Ref PartitionStateTableAccountId

  # Cross-account invoke permission for the partition-sync Step Function.
  # The state machine lives in the management account and invokes this
  # Lambda by its full ARN as part of the 6-hour sync cron.
  LambdaPermissionsLambdaInvokeByStateMachine:
    Condition: IsAuditAccountAndCrossAccountTable
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LambdaPermissionsLambda
      Principal: !Sub arn:aws:iam::${PartitionStateTableAccountId}:role/${OrganizationName}PartitionSyncStateMachineRole