##################################################################################
#   Conformance Pack: Government of Canada Guardrails
#   This conformance pack helps verify compliance with CIS AWS Foundations Benchmark Level 1 requirements.
#   See Parameters section for names and descriptions of required parameters.
##################################################################################
Parameters:
  # Common
  UpdateTriggerVersion:
    Type: String
    Default: "v1.1"
  PartitionSuffix:
    Type: String
    Default: ""
    AllowedValues:
      - ""
      - "_p2"
      - "_p3"
    Description: >-
      Suffix appended to every guardrail Config rule name and to the Lambda
      function name referenced by each rule. Empty for partition 1 (the base
      / "P1" pack); ``_p2`` and ``_p3`` are used by the partition-2 and
      partition-3 packs created by ConformancePackPartitions.yaml when the
      organization grows beyond ``MaxAccountsPerPartition`` accounts.
  GCLambdaExecutionRoleName:
    Type: String
  GCLambdaExecutionRoleName2:
    Type: String
  AuditAccountID:
    Type: String
  BGA1:
    Type: String
  BGA2:
    Type: String
  BGA3:
    Type: String
    Default: ""
  BGA4:
    Type: String
    Default: ""
  OrganizationName:
    Type: String
  DeployVersion:
    Type: String
  LogArchiveAccountName:
    Type: String
  # GC01
  S3AttestationLetterPath:
    Type: String
  RuleNamingConventionFilePath:
    Type: String
  PasswordPolicyMinimumPasswordLength:
    Default: "12"
    Type: String
  PasswordPolicyMaxPasswordAge:
    Default: "90"
    Type: String
  PasswordPolicyPasswordReusePrevention:
    Default: "24"
    Type: String
  PasswordPolicyRequireSymbols:
    Default: "False"
    Type: String
  PasswordPolicyRequireNumbers:
    Default: "False"
    Type: String
  PasswordPolicyRequireUppercaseCharacters:
    Default: "True"
    Type: String
  PasswordPolicyRequireLowercaseCharacters:
    Default: "True"
    Type: String
  PasswordPolicyAllowUsersToChangePassword:
    Default: "True"
    Type: String
  PasswordPolicyHardExpiry:
    Default: "False"
    Type: String
  PrivilegedUsersFilePath:
    Type: String
  NonPrivilegedUsersFilePath:
    Type: String
  LogSourceAttestationFilePath:
    Type: String
  ExternalAlertsAttestationFilePath:
    Type: String

  # GC02
  S3AccountManagementPlanPath:
    Type: String
  S3RoleAssignmentReviewDocumentPath:
    Type: String
  S3AccessManagementAttestationDocumentPath:
    Type: String
  S3AdminAccountListPath:
    Type: String
  GC03AlarmList:
    Default: "AWS-IAM-Authentication-From-Unapproved-IP,AWS-SSO-Authentication-From-Unapproved-IP,AWS-Console-SignIn-Without-MFA"
    Type: String
  # GC03
  S3VpnIpRangesPath:
    Type: String
  # GC04
  EnterpriseMonitoringIAMRoleName:
    Default: "GC-CloudBrokering"
    Type: String
  EnterpriseMonitoringIAMTrustedPrincipal:
    Default: "arn:aws:iam::939755092653:root"
    Type: String
  # GC07
  S3CasCurrentlyInUsePath:
    Type: String
  S3SecureNetworkTransmissionPolicyPath:
    Type: String
  S3NonComplianceOptoutFilePath:
    Type: String
  # GC08
  S3TargetNetworkArchitecturePath:
    Type: String
  S3TargetCloudDeploymentGuideDocumentPath:
    Type: String
  S3TargetCloudSegmentationDesignDocumentPath:
    Type: String
  # GC09
  S3NetworkArchitectureDocumentPath:
    Type: String
  # GC10
  S3LogBucketsPath:
    Type: String
  # GC11
  S3MonitoringUseCasesPath:
    Type: String
  # GC13
  S3AccountManagementProcedurePath:
    Type: String
  S3AccountMgmtApprovalsPath:
    Type: String
  S3EmergencyAccountAlertsRuleNamesPath:
    Type: String
  LogSourceNonComplianceAttestationFilePath:
    Type: String
  ExternalAlertsNonComplianceAttestationFilePath:
    Type: String

Resources:
  # GC01
  GC01CheckRootAccountMFAEnabled:
    Type: "AWS::Config::ConfigRule"
    Properties:
      ConfigRuleName: gc01_check_root_mfa
      Description: "Confirms that MFA is enabled for the root account. Remediate by enabling MFA on the root user per AWS root-user MFA guidance. Source: https://github.com/canada-ca/cloud-guardrails/blob/master/EN/01_Protect-user-accounts-and-identities.md"
      InputParameters:
        ExecutionRoleName:
          Fn::If:
            - GCLambdaExecutionRoleName
            - Ref: GCLambdaExecutionRoleName
            - Ref: AWS::NoValue
        AuditAccountID:
          Fn::If:
            - auditAccountID
            - Ref: AuditAccountID
            - Ref: AWS::NoValue
      Scope:
        ComplianceResourceTypes:
          - AWS::Account
      MaximumExecutionFrequency: TwentyFour_Hours
      Source:
        Owner: CUSTOM_LAMBDA
        SourceIdentifier:
          Fn::Join:
            - ""
            - - "arn:aws:lambda:ca-central-1:"
              - Ref: AuditAccountID
              - !Sub ":function:${OrganizationName}gc01_check_root_mfa${PartitionSuffix}"
        SourceDetails:
          - EventSource: "aws.config"
            MessageType: "ScheduledNotification"

  GC01CheckFederatedUsersMfaConfigRule:
    Type: "AWS::Config::ConfigRule"
    Properties:
      ConfigRuleName: gc01_check_federated_users_mfa
      Description: "Confirms that MFA is enabled for federated users. Remediate by enabling MFA at the federated identity provider. Source: https://github.com/canada-ca/cloud-guardrails/blob/master/EN/01_Protect-user-accounts-and-identities.md"
      InputParameters:
        ExecutionRoleName:
          Fn::If:
            - GCLambdaExecutionRoleName
            - Ref: GCLambdaExecutionRoleName
            - Ref: AWS::NoValue
        AuditAccountID:
          Fn::If:
            - auditAccountID
            - Ref: AuditAccountID
            - Ref: AWS::NoValue
      Scope:
        ComplianceResourceTypes:
          - AWS::Account
      MaximumExecutionFrequency: TwentyFour_Hours
      Source:
        Owner: CUSTOM_LAMBDA
        SourceIdentifier:
          Fn::Join:
            - ""
            - - "arn:aws:lambda:ca-central-1:"
              - Ref: AuditAccountID
              - !Sub ":function:${OrganizationName}gc01_check_federated_users_mfa${PartitionSuffix}"
        SourceDetails:
          - EventSource: "aws.config"
            MessageType: "ScheduledNotification"

  GC01CheckMonitoringAndLoggingConfigRule:
    Type: "AWS::Config::ConfigRule"
    Properties:
      ConfigRuleName: gc01_check_monitoring_and_logging
      Description: "Confirms that CloudTrail and account monitoring are enabled. Remediate by configuring a multi-region CloudTrail trail with logging active. Source: https://github.com/canada-ca/cloud-guardrails/blob/master/EN/01_Protect-user-accounts-and-identities.md"
      InputParameters:
        ExecutionRoleName:
          Fn::If:
            - GCLambdaExecutionRoleName
            - Ref: GCLambdaExecutionRoleName
            - Ref: AWS::NoValue
        AuditAccountID:
          Fn::If:
            - auditAccountID
            - Ref: AuditAccountID
            - Ref: AWS::NoValue
      Scope:
        ComplianceResourceTypes:
          - AWS::Account
          - AWS::CloudTrail::Trail
      MaximumExecutionFrequency: TwentyFour_Hours
      Source:
        Owner: CUSTOM_LAMBDA
        SourceIdentifier:
          Fn::Join:
            - ""
            - - "arn:aws:lambda:ca-central-1:"
              - Ref: AuditAccountID
              - !Sub ":function:${OrganizationName}gc01_check_monitoring_and_logging${PartitionSuffix}"
        SourceDetails:
          - EventSource: "aws.config"
            MessageType: "ScheduledNotification"

  GC01CheckAlertsFlagMisuseConfigRule:
    Type: "AWS::Config::ConfigRule"
    Properties:
      ConfigRuleName: gc01_check_alerts_flag_misuse
      Description: "Confirms that GuardDuty or EventBridge alerts flag account misuse. Remediate by enabling GuardDuty or configuring EventBridge rules for alerts. Source: https://github.com/canada-ca/cloud-guardrails/blob/master/EN/01_Protect-user-accounts-and-identities.md"
      InputParameters:
        RuleNamingConventionFilePath:
          Fn::If:
            - ruleNamingConventionFilePath
            - Ref: RuleNamingConventionFilePath
            - Ref: AWS::NoValue
        ExecutionRoleName:
          Fn::If:
            - GCLambdaExecutionRoleName
            - Ref: GCLambdaExecutionRoleName
            - Ref: AWS::NoValue
        AuditAccountID:
          Fn::If:
            - auditAccountID
            - Ref: AuditAccountID
            - Ref: AWS::NoValue
        LogSourceAttestationFilePath:
          Fn::If:
            - logSourceAttestationFilePath
            - Ref: LogSourceAttestationFilePath
            - Ref: AWS::NoValue
        ExternalAlertsAttestationFilePath:
          Fn::If:
            - externalAlertsAttestationFilePath
            - Ref: ExternalAlertsAttestationFilePath
            - Ref: AWS::NoValue
      Scope:
        ComplianceResourceTypes:
          - AWS::Account
          - AWS::Events::Rule
      MaximumExecutionFrequency: TwentyFour_Hours
      Source:
        Owner: CUSTOM_LAMBDA
        SourceIdentifier:
          Fn::Join:
            - ""
            - - "arn:aws:lambda:ca-central-1:"
              - Ref: AuditAccountID
              - !Sub ":function:${OrganizationName}gc01_check_alerts_flag_misuse${PartitionSuffix}"
        SourceDetails:
          - EventSource: "aws.config"
            MessageType: "ScheduledNotification"

  GC01CheckMFADigitalPolicy:
    Type: "AWS::Config::ConfigRule"
    Properties:
      ConfigRuleName: gc01_check_mfa_digital_policy
      Description: "Confirms that a digital policy enforces MFA for federated identities. Remediate by configuring an MFA-enforcement policy at your IdP. Source: https://github.com/canada-ca/cloud-guardrails/blob/master/EN/01_Protect-user-accounts-and-identities.md"
      InputParameters:
        ExecutionRoleName:
          Fn::If:
            - GCLambdaExecutionRoleName
            - Ref: GCLambdaExecutionRoleName
            - Ref: AWS::NoValue
        AuditAccountID:
          Fn::If:
            - auditAccountID
            - Ref: AuditAccountID
            - Ref: AWS::NoValue
      Scope:
        ComplianceResourceTypes:
          - AWS::Account
      MaximumExecutionFrequency: TwentyFour_Hours
      Source:
        Owner: CUSTOM_LAMBDA
        SourceIdentifier:
          Fn::Join:
            - ""
            - - "arn:aws:lambda:ca-central-1:"
              - Ref: AuditAccountID
              - !Sub ":function:${OrganizationName}gc01_check_mfa_digital_policy${PartitionSuffix}"
        SourceDetails:
          - EventSource: "aws.config"
            MessageType: "ScheduledNotification"

  GC01CheckDedicatedAdminAccount:
    Type: "AWS::Config::ConfigRule"
    Properties:
      ConfigRuleName: gc01_check_dedicated_admin_account
      Description: "Confirms that dedicated admin users exist and non-privileged users lack admin access. Remediate by adjusting IAM or Identity Center permissions. Source: https://github.com/canada-ca/cloud-guardrails/blob/master/EN/01_Protect-user-accounts-and-identities.md"
      InputParameters:
        PrivilegedUsersFilePath:
          Fn::If:
            - privilegedUsersFilePath
            - Ref: PrivilegedUsersFilePath
            - Ref: AWS::NoValue
        NonPrivilegedUsersFilePath:
          Fn::If:
            - nonPrivilegedUsersFilePath
            - Ref: NonPrivilegedUsersFilePath
            - Ref: AWS::NoValue
        ExecutionRoleName:
          Fn::If:
            - GCLambdaExecutionRoleName
            - Ref: GCLambdaExecutionRoleName
            - Ref: AWS::NoValue
        AuditAccountID:
          Fn::If:
            - auditAccountID
            - Ref: AuditAccountID
            - Ref: AWS::NoValue
      Scope:
        ComplianceResourceTypes:
          - AWS::Account
      MaximumExecutionFrequency: TwentyFour_Hours
      Source:
        Owner: CUSTOM_LAMBDA
        SourceIdentifier:
          Fn::Join:
            - ""
            - - "arn:aws:lambda:ca-central-1:"
              - Ref: AuditAccountID
              - !Sub ":function:${OrganizationName}gc01_check_dedicated_admin_account${PartitionSuffix}"
        SourceDetails:
          - EventSource: "aws.config"
            MessageType: "ScheduledNotification"

  GC01CheckIamUsersMfaConfigRule:
    Type: "AWS::Config::ConfigRule"
    Properties:
      ConfigRuleName: gc01_check_iam_users_mfa
      Description: "Confirms that MFA is enabled for all IAM users. Remediate by enabling an MFA device for each IAM user per AWS IAM MFA guidance. Source: https://github.com/canada-ca/cloud-guardrails/blob/master/EN/01_Protect-user-accounts-and-identities.md"
      InputParameters:
        ExecutionRoleName:
          Fn::If:
            - GCLambdaExecutionRoleName
            - Ref: GCLambdaExecutionRoleName
            - Ref: AWS::NoValue
        AuditAccountID:
          Fn::If:
            - auditAccountID
            - Ref: AuditAccountID
            - Ref: AWS::NoValue
        BgUser1:
          Fn::If:
            - bgUser1
            - Ref: BGA1
            - Ref: AWS::NoValue
        BgUser2:
          Fn::If:
            - bgUser2
            - Ref: BGA2
            - Ref: AWS::NoValue
        BgUser3:
          Fn::If:
            - bgUser3
            - Ref: BGA3
            - Ref: AWS::NoValue
        BgUser4:
          Fn::If:
            - bgUser4
            - Ref: BGA4
            - Ref: AWS::NoValue
      Scope:
        ComplianceResourceTypes:
          - AWS::Account
          - AWS::IAM::User
      MaximumExecutionFrequency: TwentyFour_Hours
      Source:
        Owner: CUSTOM_LAMBDA
        SourceIdentifier:
          Fn::Join:
            - ""
            - - "arn:aws:lambda:ca-central-1:"
              - Ref: AuditAccountID
              - !Sub ":function:${OrganizationName}gc01_check_iam_users_mfa${PartitionSuffix}"
        SourceDetails:
          - EventSource: "aws.config"
            MessageType: "ScheduledNotification"
  # GC02
  GC02CheckPrivilegedRolesReviewConfigRule:
    Type: "AWS::Config::ConfigRule"
    Properties:
      ConfigRuleName: gc02_check_privileged_roles_review
      Description: "Confirms that a privileged role review document exists in S3 and is current within 12 months. Remediate by uploading the review to the configured S3 path. Source: https://github.com/canada-ca/cloud-guardrails/blob/master/EN/02_Manage-Access.md"
      InputParameters:
        s3ObjectPath:
          Fn::If:
            - s3RoleAssignmentReviewDocumentPath
            - Ref: S3RoleAssignmentReviewDocumentPath
            - Ref: AWS::NoValue
        ExecutionRoleName:
          Fn::If:
            - GCLambdaExecutionRoleName
            - Ref: GCLambdaExecutionRoleName
            - Ref: AWS::NoValue
        AuditAccountID:
          Fn::If:
            - auditAccountID
            - Ref: AuditAccountID
            - Ref: AWS::NoValue
      Scope:
        ComplianceResourceTypes:
          - AWS::Account
      MaximumExecutionFrequency: TwentyFour_Hours
      Source:
        Owner: CUSTOM_LAMBDA
        SourceIdentifier:
          Fn::Join:
            - ""
            - - "arn:aws:lambda:ca-central-1:"
              - Ref: AuditAccountID
              - !Sub ":function:${OrganizationName}gc02_check_privileged_roles_review${PartitionSuffix}"
        SourceDetails:
          - EventSource: "aws.config"
            MessageType: "ScheduledNotification"
 
  GC02CheckGroupAccessConfigurationConfigRule:
    Type: "AWS::Config::ConfigRule"
    Properties:
      ConfigRuleName: gc02_check_group_access_configuration
      Description: "Confirms that admin and non-admin groups have correctly scoped policies and members. Remediate by adjusting group policies or memberships in IAM/Identity Center. Source: https://github.com/canada-ca/cloud-guardrails/blob/master/EN/02_Manage-Access.md"
      InputParameters:
        s3ObjectPath:
          Fn::If:
            - s3AdminAccountListPath
            - Ref: S3AdminAccountListPath
            - Ref: AWS::NoValue
        ExecutionRoleName:
          Fn::If:
            - GCLambdaExecutionRoleName
            - Ref: GCLambdaExecutionRoleName
            - Ref: AWS::NoValue
        AuditAccountID:
          Fn::If:
            - auditAccountID
            - Ref: AuditAccountID
            - Ref: AWS::NoValue
      Scope:
        ComplianceResourceTypes:
          - AWS::Account
      MaximumExecutionFrequency: TwentyFour_Hours
      Source:
        Owner: CUSTOM_LAMBDA
        SourceIdentifier:
          Fn::Join:
            - ""
            - - "arn:aws:lambda:ca-central-1:"
              - Ref: AuditAccountID
              - !Sub ":function:${OrganizationName}gc02_check_group_access_configuration${PartitionSuffix}"
        SourceDetails:
          - EventSource: "aws.config"
            MessageType: "ScheduledNotification"
  GC02CheckPasswordProtectionMechanismsConfigRule:
    Type: "AWS::Config::ConfigRule"
    Properties:
      ConfigRuleName: gc02_check_password_protection_mechanisms
      Description: "Confirms that an account management plan is present in S3 and password protections meet GC guidance. Remediate by uploading the plan to the S3 path. Source: https://github.com/canada-ca/cloud-guardrails/blob/master/EN/02_Manage-Access.md"
      InputParameters:
        ExecutionRoleName:
          Fn::If:
            - GCLambdaExecutionRoleName
            - Ref: GCLambdaExecutionRoleName
            - Ref: AWS::NoValue
        AuditAccountID:
          Fn::If:
            - auditAccountID
            - Ref: AuditAccountID
            - Ref: AWS::NoValue
      Scope:
        ComplianceResourceTypes:
          - AWS::Account
      MaximumExecutionFrequency: TwentyFour_Hours
      Source:
        Owner: CUSTOM_LAMBDA
        SourceIdentifier:
          Fn::Join:
            - ""
            - - "arn:aws:lambda:ca-central-1:"
              - Ref: AuditAccountID
              - !Sub ":function:${OrganizationName}gc02_check_password_protection_mechanisms${PartitionSuffix}"
        SourceDetails:
          - EventSource: "aws.config"
            MessageType: "ScheduledNotification"
  GC02CheckIAMPasswordPolicyConfigRule:
    Type: "AWS::Config::ConfigRule"
    Properties:
      ConfigRuleName: gc02_check_iam_password_policy
      Description: "Confirms that the IAM password policy aligns with GC guidance (min length 12, no complexity, no expiry). Remediate by updating IAM Account settings. Source: https://github.com/canada-ca/cloud-guardrails/blob/master/EN/02_Manage-Access.md"
      InputParameters:
        ExecutionRoleName:
          Fn::If:
            - GCLambdaExecutionRoleName
            - Ref: GCLambdaExecutionRoleName
            - Ref: AWS::NoValue
        AuditAccountID:
          Fn::If:
            - auditAccountID
            - Ref: AuditAccountID
            - Ref: AWS::NoValue
        MinimumPasswordLength:
          Fn::If:
            - passwordPolicyMinimumPasswordLength
            - Ref: PasswordPolicyMinimumPasswordLength
            - Ref: AWS::NoValue
        MaxPasswordAge:
          Fn::If:
            - passwordPolicyMaxPasswordAge
            - Ref: PasswordPolicyMaxPasswordAge
            - Ref: AWS::NoValue
        PasswordReusePrevention:
          Fn::If:
            - passwordPolicyPasswordReusePrevention
            - Ref: PasswordPolicyPasswordReusePrevention
            - Ref: AWS::NoValue
        RequireSymbols:
          Fn::If:
            - passwordPolicyRequireSymbols
            - Ref: PasswordPolicyRequireSymbols
            - Ref: AWS::NoValue
        RequireNumbers:
          Fn::If:
            - passwordPolicyRequireNumbers
            - Ref: PasswordPolicyRequireNumbers
            - Ref: AWS::NoValue
        RequireUppercaseCharacters:
          Fn::If:
            - passwordPolicyRequireUppercaseCharacters
            - Ref: PasswordPolicyRequireUppercaseCharacters
            - Ref: AWS::NoValue
        RequireLowercaseCharacters:
          Fn::If:
            - passwordPolicyRequireLowercaseCharacters
            - Ref: PasswordPolicyRequireLowercaseCharacters
            - Ref: AWS::NoValue
        AllowUsersToChangePassword:
          Fn::If:
            - passwordPolicyAllowUsersToChangePassword
            - Ref: PasswordPolicyAllowUsersToChangePassword
            - Ref: AWS::NoValue
        HardExpiry:
          Fn::If:
            - passwordPolicyHardExpiry
            - Ref: PasswordPolicyHardExpiry
            - Ref: AWS::NoValue
      Scope:
        ComplianceResourceTypes:
          - AWS::Account
      MaximumExecutionFrequency: TwentyFour_Hours
      Source:
        Owner: CUSTOM_LAMBDA
        SourceIdentifier:
          Fn::Join:
            - ""
            - - "arn:aws:lambda:ca-central-1:"
              - Ref: AuditAccountID
              - !Sub ":function:${OrganizationName}gc02_check_iam_password_policy${PartitionSuffix}"
        SourceDetails:
          - EventSource: "aws.config"
            MessageType: "ScheduledNotification"
  # GC03
  GC03CheckEndpointAccessConfigConfigRule:
    Type: "AWS::Config::ConfigRule"
    Properties:
      ConfigRuleName: gc03_check_endpoint_access_config
      Description: "Confirms that endpoint access configurations for devices align with the federated IdP. Remediate by ensuring the IdP enforces required endpoint controls. Source: https://github.com/canada-ca/cloud-guardrails/blob/master/EN/03_Secure-Endpoints.md"
      InputParameters:
        ExecutionRoleName:
          Fn::If:
            - GCLambdaExecutionRoleName
            - Ref: GCLambdaExecutionRoleName
            - Ref: AWS::NoValue
        AuditAccountID:
          Fn::If:
            - auditAccountID
            - Ref: AuditAccountID
            - Ref: AWS::NoValue
      Scope:
        ComplianceResourceTypes:
          - AWS::Account
      MaximumExecutionFrequency: TwentyFour_Hours
      Source:
        Owner: CUSTOM_LAMBDA
        SourceIdentifier:
          Fn::Join:
            - ""
            - - "arn:aws:lambda:ca-central-1:"
              - Ref: AuditAccountID
              - !Sub ":function:${OrganizationName}gc03_check_endpoint_access_config${PartitionSuffix}"
        SourceDetails:
          - EventSource: "aws.config"
            MessageType: "ScheduledNotification"
  GC03CheckTrustedDevicesAdminAccessConfigRule:
    Type: "AWS::Config::ConfigRule"
    Properties:
      ConfigRuleName: gc03_check_trusted_devices_admin_access
      Description: "Confirms that CloudWatch alarms detect unapproved IP access and sign-ins without MFA. Remediate by creating the required alarms in CloudWatch. Source: https://github.com/canada-ca/cloud-guardrails/blob/master/EN/03_Secure-Endpoints.md"
      InputParameters:
        ExecutionRoleName:
          Fn::If:
            - GCLambdaExecutionRoleName
            - Ref: GCLambdaExecutionRoleName
            - Ref: AWS::NoValue
        AuditAccountID:
          Fn::If:
            - auditAccountID
            - Ref: AuditAccountID
            - Ref: AWS::NoValue
        s3ObjectPath:
          Fn::If:
            - s3VpnIpRangesPath
            - Ref: S3VpnIpRangesPath
            - Ref: AWS::NoValue
        BgUser1:
          Fn::If:
            - bgUser1
            - Ref: BGA1
            - Ref: AWS::NoValue
        BgUser2:
          Fn::If:
            - bgUser2
            - Ref: BGA2
            - Ref: AWS::NoValue
        BgUser3:
          Fn::If:
            - bgUser3
            - Ref: BGA3
            - Ref: AWS::NoValue
        BgUser4:
          Fn::If:
            - bgUser4
            - Ref: BGA4
            - Ref: AWS::NoValue
      Scope:
        ComplianceResourceTypes:
          - AWS::Account
      MaximumExecutionFrequency: TwentyFour_Hours
      Source:
        Owner: CUSTOM_LAMBDA
        SourceIdentifier:
          Fn::Join:
            - ""
            - - "arn:aws:lambda:ca-central-1:"
              - Ref: AuditAccountID
              - !Sub ":function:${OrganizationName}gc03_check_trusted_devices_admin_access${PartitionSuffix}"
        SourceDetails:
          - EventSource: "aws.config"
            MessageType: "ScheduledNotification"
  # GC04
  GC04CheckEnterpriseMonitoringConfigRule:
    Type: "AWS::Config::ConfigRule"
    Properties:
      ConfigRuleName: gc04_check_enterprise_monitoring
      Description: "Confirms that the enterprise monitoring IAM role and policy exist and are attached. Remediate by creating the role and policy per GC04 guidance. Source: https://github.com/canada-ca/cloud-guardrails/blob/master/EN/04_Enterprise-Monitoring-Accounts.md"
      InputParameters:
        IAM_Role_Name:
          Fn::If:
            - enterpriseMonitoringIAMRoleName
            - Ref: EnterpriseMonitoringIAMRoleName
            - Ref: AWS::NoValue
        IAM_Trusted_Principal:
          Fn::If:
            - enterpriseMonitoringIAMTrustedPrincipal
            - Ref: EnterpriseMonitoringIAMTrustedPrincipal
            - Ref: AWS::NoValue
        ExecutionRoleName:
          Fn::If:
            - GCLambdaExecutionRoleName
            - Ref: GCLambdaExecutionRoleName
            - Ref: AWS::NoValue
        AuditAccountID:
          Fn::If:
            - auditAccountID
            - Ref: AuditAccountID
            - Ref: AWS::NoValue
      Scope:
        ComplianceResourceTypes:
          - AWS::Account
      MaximumExecutionFrequency: TwentyFour_Hours
      Source:
        Owner: CUSTOM_LAMBDA
        SourceIdentifier:
          Fn::Join:
            - ""
            - - "arn:aws:lambda:ca-central-1:"
              - Ref: AuditAccountID
              - !Sub ":function:${OrganizationName}gc04_check_enterprise_monitoring${PartitionSuffix}"
        SourceDetails:
          - EventSource: "aws.config"
            MessageType: "ScheduledNotification"
  GC04CheckAlertsFlagMisuseConfigRule:
    Type: "AWS::Config::ConfigRule"
    Properties:
      ConfigRuleName: gc04_check_alerts_flag_misuse
      Description: "Confirms that EventBridge rules flag misuse or changes to the cloud broker role. Remediate by creating EventBridge rules per the naming convention. Source: https://github.com/canada-ca/cloud-guardrails/blob/master/EN/04_Enterprise-Monitoring-Accounts.md"
      InputParameters:
        IAM_Role_Name:
          Fn::If:
            - enterpriseMonitoringIAMRoleName
            - Ref: EnterpriseMonitoringIAMRoleName
            - Ref: AWS::NoValue
        ExecutionRoleName:
          Fn::If:
            - GCLambdaExecutionRoleName
            - Ref: GCLambdaExecutionRoleName
            - Ref: AWS::NoValue
        AuditAccountID:
          Fn::If:
            - auditAccountID
            - Ref: AuditAccountID
            - Ref: AWS::NoValue
      Scope:
        ComplianceResourceTypes:
          - AWS::Account
      MaximumExecutionFrequency: TwentyFour_Hours
      Source:
        Owner: CUSTOM_LAMBDA
        SourceIdentifier:
          Fn::Join:
            - ""
            - - "arn:aws:lambda:ca-central-1:"
              - Ref: AuditAccountID
