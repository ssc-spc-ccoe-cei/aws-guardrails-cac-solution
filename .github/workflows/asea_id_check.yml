name: ASEA AWS Identity Check
 
on:
  push:
    branches:
      - feature/aws-dashboard
  workflow_dispatch:
 
permissions:
  id-token: write
  contents: read
 
jobs:
  identity-check:
    environment: asea-integration
    runs-on: ubuntu-latest
 
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: cac-asea-identity-check
          aws-region: ${{ env.AWS_REGION }}
 
      - name: Verify assumed AWS account
        run: |
          test -n "${AWS_REGION}"
          test -n "${AWS_ACCOUNT_ID}"
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          arn="$(aws sts get-caller-identity --query Arn --output text)"
 
          echo "Assumed account: ${account_id}"
          echo "Assumed role: ${arn}"
          test "${account_id}" = "${AWS_ACCOUNT_ID}"
