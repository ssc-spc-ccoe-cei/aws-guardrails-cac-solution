name: LZA AWS Identity Check
 
on:
  push:
    branches:
      - v3.0.0beta2
  workflow_dispatch:
 
permissions:
  id-token: write
  contents: read
 
jobs:
  identity-check:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.LZA_AWS_ROLE_ARN }}
          role-session-name: cac-lza-identity-check
          aws-region: ca-central-1
 
      - name: Verify assumed AWS account
        env:
          EXPECTED_ACCOUNT_ID: "533267386226"
        run: |
          set -euo pipefail
 
          IDENTITY="$(aws sts get-caller-identity --output json)"
          ACCOUNT_ID="$(echo "${IDENTITY}" | jq -r '.Account')"
          ARN="$(echo "${IDENTITY}" | jq -r '.Arn')"
 
          echo "Assumed account: ${ACCOUNT_ID}"
          echo "Assumed role: ${ARN}"
 
          if [ "${ACCOUNT_ID}" != "${EXPECTED_ACCOUNT_ID}" ]; then
            echo "::error::Expected account ${EXPECTED_ACCOUNT_ID} but assumed ${ACCOUNT_ID}"
            exit 1
          fi
 
          echo "Account verified."
