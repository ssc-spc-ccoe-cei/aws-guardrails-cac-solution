name: ASEA Build Check
 
on:
  push:
    branches:
      - feature/aws-dashboard
  workflow_dispatch:
 
permissions:
  id-token: write
  contents: read
 
jobs:
  build-check:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TEST_AWS_ROLE_ARN }}
          role-session-name: cac-build-check
          aws-region: ca-central-1
 
      - name: Verify assumed AWS account
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "Assumed account: ${account_id}"
          test "${account_id}" = "526878402113"
 
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install aws-sam-cli boto3 ruamel.yaml
          sudo snap install yq
          jq --version
          yq --version
          sam --version
 
      - name: Create configuration from the protected secret
        env:
          CONFIG_FILE_CONTENT: ${{ secrets.TEST_CONFIG_FILE_CONTENT }}
        run: |
          test -n "${CONFIG_FILE_CONTENT}"
          printf '%s\n' "${CONFIG_FILE_CONTENT}" > config.yaml
 
      - name: Validate ASEA configuration
        run: |
          test "$(yq -r '.Parameters.OrganizationId' config.yaml)" = "o-y6q3uhajcr"
          test "$(yq -r '.Parameters.AuditAccountID' config.yaml)" = "251534099486"
          test "$(yq -r '.Parameters.SecurityOUID' config.yaml)" = "ou-bv5z-a34miw2j"
          test "$(yq -r '.Parameters.AcceleratorRole' config.yaml)" = "AWSAccelerator-PipelineRole"
          test "$(yq -r '.Parameters.AccelRolePrefix' config.yaml)" = "AWSAccelerator-"
          mkdir -p build
          ./tools/get-aws-config.py --input config.yaml --output build/params.json
 
      - name: Build Lambda artifacts
        run: |
          chmod +x tools/buildsam.sh tools/samclean.sh
          ./tools/samclean.sh -p src/
          ./tools/buildsam.sh -p src/
 
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: cac-build-${{ github.sha }}
          path: |
            build/params.json
            src/**/build/
          if-no-files-found: error
