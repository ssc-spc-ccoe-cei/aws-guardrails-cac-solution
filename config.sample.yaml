  # MaxPartitions is hard-capped at 4 by the templates and the 4 KB
  # CloudFormation Custom Resource response limit - see doc/RESOURCE_POLICY_FIX.md.
  MaxAccountsPerPartition: 60
  MaxPartitions: 4